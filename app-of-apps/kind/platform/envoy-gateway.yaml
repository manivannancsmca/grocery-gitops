# Envoy Gateway controller + Gateway API CRDs. Wave -30. Pruning stays off: removing CRDs would delete every
# Gateway and HTTPRoute in the cluster. The CRDs are large, so they are applied server-side.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  labels:
    grocery.io/group: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: grocery-platform
  sources:
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: 1.10.0
      helm:
        releaseName: envoy-gateway
        valueFiles:
          - $values/platform/envoy-gateway/values-kind.yaml
    - repoURL: git@github.com:manivannancsmca/grocery-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
