# Sealed Secrets controller (decrypts the SealedSecrets committed to Git). Wave -30: before anything that needs a
# secret. Chart from the project's Helm repository, values from this Git repository (multi-source "$values").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  labels:
    grocery.io/group: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: grocery-platform
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.22.0
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/platform/sealed-secrets/values-kind.yaml
    - repoURL: git@github.com:manivannancsmca/grocery-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false          # the controller holds the sealing key: never removed automatically
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
