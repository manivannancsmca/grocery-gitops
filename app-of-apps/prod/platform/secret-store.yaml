apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
  labels:
    grocery.io/group: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: grocery-platform
  source:
    repoURL: git@github.com:manivannancsmca/grocery-gitops.git
    targetRevision: main
    path: platform/external-secrets/overlays/prod
  destination:
    server: https://kubernetes.default.svc
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
