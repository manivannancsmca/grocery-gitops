# ROOT Application of the staging environment, applied once on the staging EKS cluster's own Argo CD (see docs/eks.md).
# Each environment has its own cluster and its own Argo CD: production credentials never live in a non-production
# Argo CD, and App of Apps only organises the Applications inside each one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grocery-staging
  namespace: argocd
  labels:
    grocery.io/group: root
spec:
  project: grocery-platform
  source:
    repoURL: git@github.com:manivannancsmca/grocery-gitops.git
    targetRevision: main
    path: app-of-apps/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
