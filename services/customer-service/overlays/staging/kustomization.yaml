# customer-service on the staging EKS cluster: 2+ replicas (HPA), PodDisruptionBudget, spread over zones, secrets from
# AWS Secrets Manager (External Secrets Operator), the "aws" Spring profile (services/_shared/overlays/staging).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - external-secrets.yaml
images:
  - name: grocery/customer-service
    newName: ghcr.io/manivannancsmca/grocery-customer-service
    newTag: sha-b100f7412810d1b0104a2ce17e0dd20df7c9cd0d
    digest: sha256:f201ef60a09a61998dbbb8511217ec4b62fd2f53488b65a2c68c6c7b611a7402
patches:
  - target: {kind: Deployment, name: customer-service}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: customer-service
      spec:
        replicas: 2
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector: {}
                matchLabelKeys: [app.kubernetes.io/name, pod-template-hash]
            containers:
              - name: app
                resources:
                  requests: { cpu: 100m, memory: 512Mi }
                  limits: { memory: 768Mi }
                envFrom:
                  - configMapRef: { name: grocery-runtime }
                  - secretRef: { name: customer-service-db }
                  - secretRef: { name: customer-service-kafka }
