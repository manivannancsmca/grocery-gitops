apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - db.sealed.yaml # customer-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of customer-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/customer-service
    newName: ghcr.io/manivannancsmca/grocery-customer-service
    newTag: sha-253e4aa724ee0e08c1a55f902e6991b6d2489c6a
    digest: sha256:1ad8adc7bb705393b878987930f3e9bdbdad6b0afb1fddb0283090bc10681372
