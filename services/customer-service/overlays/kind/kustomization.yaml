  - db.sealed.yaml # customer-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of customer-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
