    newName: ghcr.io/manivannancsmca/grocery-customer-service
    newTag: sha-a8308f2047870c1974d9ef7a36f76033d831d74c
    digest: sha256:8db3c1df8791ef372af204823600ba530b70da240d11a0d43c28a0eb8c58d1e1
