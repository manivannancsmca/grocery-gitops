# catalog-query-service: Search and product pages from Elasticsearch (read side).
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-query-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-query-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-query-service
    spec:
      containers:
        - name: app
          image: grocery/catalog-query-service
          ports:
            - { name: http, containerPort: 8106 }
