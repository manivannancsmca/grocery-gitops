# catalog-query-service on the staging EKS cluster: 2+ replicas (HPA), PodDisruptionBudget, spread over zones, secrets from
# AWS Secrets Manager (External Secrets Operator), the "aws" Spring profile (services/_shared/overlays/staging).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - external-secrets.yaml
images:
  - name: grocery/catalog-query-service
    newName: ghcr.io/manivannancsmca/grocery-catalog-query-service
    newTag: sha-27077466d8a329ac6c9510991853b43432ae33bd
    digest: sha256:e3b7f8f6b569c04878cd0a49ab0e6c507aec9bd85b44bc16b0c86440be5e1d98
patches:
  - target: {kind: Deployment, name: catalog-query-service}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog-query-service
      spec:
        replicas: 2
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector: {}
                matchLabelKeys: [app.kubernetes.io/name, pod-template-hash]
            containers:
              - name: app
                resources:
                  requests: { cpu: 100m, memory: 512Mi }
                  limits: { memory: 768Mi }
                envFrom:
                  - configMapRef: { name: grocery-runtime }
                  - secretRef: { name: catalog-query-service-kafka }
