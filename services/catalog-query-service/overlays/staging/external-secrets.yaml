# Secrets from AWS Secrets Manager (same names as the Terraform secrets module), synced by External Secrets Operator.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-query-service-kafka
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: catalog-query-service-kafka, creationPolicy: Owner }
  data:
    - secretKey: KAFKA_SASL_USERNAME
      remoteRef: { key: AmazonMSK_grocery/staging/catalog-query-service/kafka, property: username }
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef: { key: AmazonMSK_grocery/staging/catalog-query-service/kafka, property: password }
