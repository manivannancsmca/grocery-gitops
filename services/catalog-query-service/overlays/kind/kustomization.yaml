apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of catalog-query-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/catalog-query-service
    newName: ghcr.io/manivannancsmca/grocery-catalog-query-service
    newTag: sha-b100f7412810d1b0104a2ce17e0dd20df7c9cd0d
    digest: sha256:5ed141587ea96c6f44a7575f25886e65ea93231f392b64bc104e4bed2f726cb1
