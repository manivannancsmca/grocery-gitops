apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of cart-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/cart-service
    newName: ghcr.io/manivannancsmca/grocery-cart-service
    newTag: sha-253e4aa724ee0e08c1a55f902e6991b6d2489c6a
    digest: sha256:91d6492c7ced349a8e4ea0a22c1d2428060e44373380dcc069eb98281ac0b039
