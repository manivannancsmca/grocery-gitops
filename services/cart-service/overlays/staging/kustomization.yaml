# cart-service on the staging EKS cluster: 2+ replicas (HPA), PodDisruptionBudget, spread over zones, secrets from
# AWS Secrets Manager (External Secrets Operator), the "aws" Spring profile (services/_shared/overlays/staging).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - external-secrets.yaml
images:
  - name: grocery/cart-service
    newName: ghcr.io/manivannancsmca/grocery-cart-service
    newTag: sha-253e4aa724ee0e08c1a55f902e6991b6d2489c6a
    digest: sha256:91d6492c7ced349a8e4ea0a22c1d2428060e44373380dcc069eb98281ac0b039
patches:
  - target: {kind: Deployment, name: cart-service}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cart-service
      spec:
        replicas: 2
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector: {}
                matchLabelKeys: [app.kubernetes.io/name, pod-template-hash]
            containers:
              - name: app
                resources:
                  requests: { cpu: 100m, memory: 512Mi }
                  limits: { memory: 768Mi }
                envFrom:
                  - configMapRef: { name: grocery-runtime }
                  - secretRef: { name: cart-service-kafka }
