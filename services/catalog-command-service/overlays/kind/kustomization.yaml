apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - db.sealed.yaml          # catalog-command-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of catalog-command-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/catalog-command-service
    newName: ghcr.io/manivannancsmca/grocery-catalog-command-service
    newTag: unset
