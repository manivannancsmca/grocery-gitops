# catalog-command-service on the staging EKS cluster: 2+ replicas (HPA), PodDisruptionBudget, spread over zones, secrets from
# AWS Secrets Manager (External Secrets Operator), the "aws" Spring profile (services/_shared/overlays/staging).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - external-secrets.yaml
images:
  - name: grocery/catalog-command-service
    newName: ghcr.io/manivannancsmca/grocery-catalog-command-service
    newTag: sha-253e4aa724ee0e08c1a55f902e6991b6d2489c6a
    digest: sha256:28504b3bac7b9b2f6d9ddca9749cde8e4943df109666119bca4572c13e407cba
patches:
  - target: {kind: Deployment, name: catalog-command-service}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog-command-service
      spec:
        replicas: 2
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector: {}
                matchLabelKeys: [app.kubernetes.io/name, pod-template-hash]
            containers:
              - name: app
                resources:
                  requests: { cpu: 100m, memory: 512Mi }
                  limits: { memory: 768Mi }
                envFrom:
                  - configMapRef: { name: grocery-runtime }
                  - secretRef: { name: catalog-command-service-db }
                  - secretRef: { name: catalog-command-service-kafka }
