# catalog-command-service: Categories, brands and products (write side).
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-command-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-command-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-command-service
    spec:
      containers:
        - name: app
          image: grocery/catalog-command-service
          ports:
            - { name: http, containerPort: 8105 }
          env:
            - { name: DB_USERNAME, value: catalog_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: catalog-command-service-db, key: DB_PASSWORD }
