# pricing-service: Prices, price approvals and coupons.
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing-service
    spec:
      containers:
        - name: app
          image: grocery/pricing-service
          ports:
            - { name: http, containerPort: 8108 }
          env:
            - { name: DB_USERNAME, value: pricing_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pricing-service-db, key: DB_PASSWORD }
