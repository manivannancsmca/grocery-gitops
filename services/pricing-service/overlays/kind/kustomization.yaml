apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - db.sealed.yaml # pricing-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of pricing-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/pricing-service
    newName: ghcr.io/manivannancsmca/grocery-pricing-service
    newTag: sha-a8308f2047870c1974d9ef7a36f76033d831d74c
    digest: sha256:1c779f22f4c84b143b7f45ec5171b87f8dd70c1322d93c3d2371554d12ccf4f3
