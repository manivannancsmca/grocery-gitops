# reporting-service: Admin reports built from events.
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reporting-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reporting-service
    spec:
      containers:
        - name: app
          image: grocery/reporting-service
          ports:
            - { name: http, containerPort: 8116 }
          env:
            - { name: DB_USERNAME, value: reporting_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: reporting-service-db, key: DB_PASSWORD }
