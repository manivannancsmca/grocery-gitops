# Secrets from AWS Secrets Manager (same names as the Terraform secrets module), synced by External Secrets Operator.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reporting-service-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: reporting-service-db, creationPolicy: Owner }
  data:
    - secretKey: DB_USERNAME
      remoteRef: { key: grocery/prod/reporting-service/db, property: username }
    - secretKey: DB_PASSWORD
      remoteRef: { key: grocery/prod/reporting-service/db, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reporting-service-kafka
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: reporting-service-kafka, creationPolicy: Owner }
  data:
    - secretKey: KAFKA_SASL_USERNAME
      remoteRef: { key: AmazonMSK_grocery/prod/reporting-service/kafka, property: username }
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef: { key: AmazonMSK_grocery/prod/reporting-service/kafka, property: password }
