apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - db.sealed.yaml # reporting-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of reporting-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/reporting-service
    newName: ghcr.io/manivannancsmca/grocery-reporting-service
    newTag: sha-b100f7412810d1b0104a2ce17e0dd20df7c9cd0d
    digest: sha256:e326bc6ecef339696a3501eb38cfbdceb2280697ebe321128c3a82121f9f52bc
