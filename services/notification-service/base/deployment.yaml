# notification-service: In-app notifications (SSE) and e-mail.
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
    spec:
      containers:
        - name: app
          image: grocery/notification-service
          ports:
            - { name: http, containerPort: 8113 }
          env:
            - { name: DB_USERNAME, value: notification_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: notification-service-db, key: DB_PASSWORD }
            - { name: GROCERY_MAIL_ENABLED, value: "true" }
