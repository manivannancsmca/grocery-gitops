apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - db.sealed.yaml # notification-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of notification-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/notification-service
    newName: ghcr.io/manivannancsmca/grocery-notification-service
    newTag: sha-253e4aa724ee0e08c1a55f902e6991b6d2489c6a
    digest: sha256:c754a66a9a3388a67d966fe30539680df69dd120e202de75bee7d1b920d54627
