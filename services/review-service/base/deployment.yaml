# review-service: Reviews, moderation and ratings.
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: review-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: review-service
    spec:
      containers:
        - name: app
          image: grocery/review-service
          ports:
            - { name: http, containerPort: 8114 }
          env:
            - { name: DB_USERNAME, value: review_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: review-service-db, key: DB_PASSWORD }
