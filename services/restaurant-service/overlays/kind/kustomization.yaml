apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - db.sealed.yaml # restaurant-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of restaurant-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/restaurant-service
    newName: ghcr.io/manivannancsmca/grocery-restaurant-service
    newTag: sha-b100f7412810d1b0104a2ce17e0dd20df7c9cd0d
    digest: sha256:32a5ed719cd46051df8f63df42e5c7242ec4a2cd1fad7f70dac2bebe201e9a48
