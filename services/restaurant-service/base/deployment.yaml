# restaurant-service: Restaurants and menus.
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: restaurant-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restaurant-service
    spec:
      containers:
        - name: app
          image: grocery/restaurant-service
          ports:
            - { name: http, containerPort: 8104 }
          env:
            - { name: DB_USERNAME, value: restaurant_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: restaurant-service-db, key: DB_PASSWORD }
