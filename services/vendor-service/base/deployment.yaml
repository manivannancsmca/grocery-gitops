# vendor-service: Grocery stores, suppliers and purchase orders.
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vendor-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vendor-service
    spec:
      containers:
        - name: app
          image: grocery/vendor-service
          ports:
            - { name: http, containerPort: 8103 }
          env:
            - { name: DB_USERNAME, value: vendor_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: vendor-service-db, key: DB_PASSWORD }
