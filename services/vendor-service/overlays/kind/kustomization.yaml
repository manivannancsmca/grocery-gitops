apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - db.sealed.yaml # vendor-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of vendor-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/vendor-service
    newName: ghcr.io/manivannancsmca/grocery-vendor-service
    newTag: sha-b100f7412810d1b0104a2ce17e0dd20df7c9cd0d
    digest: sha256:bcd6c90b6167120afe284b76578f2421da5e5aba1687a7f22aca9d76b0072a8e
