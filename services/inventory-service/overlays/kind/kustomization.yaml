apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - db.sealed.yaml # inventory-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of inventory-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/inventory-service
    newName: ghcr.io/manivannancsmca/grocery-inventory-service
    newTag: sha-b100f7412810d1b0104a2ce17e0dd20df7c9cd0d
    digest: sha256:d32b5862ec64e208cfbda299247f8045814777954a8cfc9288e1dd1cdd5d550d
