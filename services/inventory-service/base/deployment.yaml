# inventory-service: Stock, movements and reservations.
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
    spec:
      containers:
        - name: app
          image: grocery/inventory-service
          ports:
            - { name: http, containerPort: 8107 }
          env:
            - { name: DB_USERNAME, value: inventory_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: inventory-service-db, key: DB_PASSWORD }
