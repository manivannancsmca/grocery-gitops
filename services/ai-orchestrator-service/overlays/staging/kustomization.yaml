# ai-orchestrator-service on the staging EKS cluster: 2+ replicas (HPA), PodDisruptionBudget, spread over zones, secrets from
# AWS Secrets Manager (External Secrets Operator), the "aws" Spring profile (services/_shared/overlays/staging).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - external-secrets.yaml
images:
  - name: grocery/ai-orchestrator-service
    newName: ghcr.io/manivannancsmca/grocery-ai-orchestrator-service
    newTag: sha-a8308f2047870c1974d9ef7a36f76033d831d74c
    digest: sha256:b0b7ac4e39f9cf956b5d9f78f0d0f0d6e96e496de3c882bd48c341ae8e8434ec
patches:
  - target: {kind: Deployment, name: ai-orchestrator-service}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ai-orchestrator-service
      spec:
        replicas: 2
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector: {}
                matchLabelKeys: [app.kubernetes.io/name, pod-template-hash]
            containers:
              - name: app
                resources:
                  requests: { cpu: 100m, memory: 768Mi }
                  limits: { memory: 1Gi }
                envFrom:
                  - configMapRef: { name: grocery-runtime }
                  - secretRef: { name: ai-orchestrator-service-db }
                  - secretRef: { name: ai-orchestrator-service-kafka }
