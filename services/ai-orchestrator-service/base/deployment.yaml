# ai-orchestrator-service: AI assistants with tool guards and human approvals.
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestrator-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-orchestrator-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-orchestrator-service
    spec:
      containers:
        - name: app
          image: grocery/ai-orchestrator-service
          ports:
            - { name: http, containerPort: 8115 }
          env:
            - { name: DB_USERNAME, value: ai_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: ai-orchestrator-service-db, key: DB_PASSWORD }
            - { name: GROCERY_AI_GATEWAY_URL, value: "http://api-gateway:8080" }
            - { name: AI_VOICE_MODE, value: "browser" }
