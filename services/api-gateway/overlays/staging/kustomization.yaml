# api-gateway on the staging EKS cluster: 2+ replicas (HPA), PodDisruptionBudget, spread over zones, secrets from
# AWS Secrets Manager (External Secrets Operator), the "aws" Spring profile (services/_shared/overlays/staging).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
images:
  - name: grocery/api-gateway
    newName: ghcr.io/manivannancsmca/grocery-api-gateway
    newTag: sha-a8308f2047870c1974d9ef7a36f76033d831d74c
    digest: sha256:fe6c945a81a9a9700f5e42ec3523325aac7963665b0430817fb536ef550ddd41
patches:
  - target: {kind: Deployment, name: api-gateway}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-gateway
      spec:
        replicas: 2
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector: {}
                matchLabelKeys: [app.kubernetes.io/name, pod-template-hash]
            containers:
              - name: app
                resources:
                  requests: { cpu: 100m, memory: 512Mi }
                  limits: { memory: 768Mi }
