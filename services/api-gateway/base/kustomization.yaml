apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
components:
  - ../../_components/spring-boot

# The gateway serves /actuator only on its internal management port (9080); the public port answers 404 there.
patches:
  - target: { kind: Deployment, name: api-gateway }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: management
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: management
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: management
