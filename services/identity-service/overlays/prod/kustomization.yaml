# identity-service on the prod EKS cluster: 3+ replicas (HPA), PodDisruptionBudget, spread over zones, secrets from
# AWS Secrets Manager (External Secrets Operator), the "aws" Spring profile (services/_shared/overlays/prod).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - external-secrets.yaml
images:
  - name: grocery/identity-service
    newName: ghcr.io/manivannancsmca/grocery-identity-service
    newTag: unset
patches:
  - target: { kind: Deployment, name: identity-service }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: identity-service
      spec:
        replicas: 3
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector: {}
                matchLabelKeys: [app.kubernetes.io/name, pod-template-hash]
            containers:
              - name: app
                resources:
                  requests: { cpu: 250m, memory: 768Mi }
                  limits: { memory: 1Gi }
                envFrom:
                  - configMapRef: { name: grocery-runtime }
                  - secretRef: { name: identity-service-db }
                  - secretRef: { name: identity-service-kafka }
