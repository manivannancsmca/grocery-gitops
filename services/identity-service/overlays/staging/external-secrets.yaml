# Secrets from AWS Secrets Manager (same names as the Terraform secrets module), synced by External Secrets Operator.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-service-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: identity-service-db, creationPolicy: Owner }
  data:
    - secretKey: DB_USERNAME
      remoteRef: { key: grocery/staging/identity-service/db, property: username }
    - secretKey: DB_PASSWORD
      remoteRef: { key: grocery/staging/identity-service/db, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-service-kafka
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: identity-service-kafka, creationPolicy: Owner }
  data:
    - secretKey: KAFKA_SASL_USERNAME
      remoteRef: { key: AmazonMSK_grocery/staging/identity-service/kafka, property: username }
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef: { key: AmazonMSK_grocery/staging/identity-service/kafka, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-service-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: identity-service-admin, creationPolicy: Owner }
  data:
    - secretKey: BOOTSTRAP_ADMIN_EMAIL
      remoteRef: { key: grocery/staging/identity-service/bootstrap-admin, property: email }
    - secretKey: BOOTSTRAP_ADMIN_PASSWORD
      remoteRef: { key: grocery/staging/identity-service/bootstrap-admin, property: password }
