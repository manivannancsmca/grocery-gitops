apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - db.sealed.yaml          # identity-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
  - admin.sealed.yaml       # identity-service-admin: BOOTSTRAP_ADMIN_EMAIL / _PASSWORD
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of identity-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/identity-service
    newName: ghcr.io/manivannancsmca/grocery-identity-service
    newTag: unset
