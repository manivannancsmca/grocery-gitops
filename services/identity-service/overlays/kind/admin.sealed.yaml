# SealedSecret grocery/identity-service-admin - generated by bootstrap/scripts/seal-kind-secrets.ps1; decryptable only by the Kind cluster's controller.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: identity-service-admin
  namespace: grocery
spec:
  encryptedData:
    BOOTSTRAP_ADMIN_EMAIL: 
    BOOTSTRAP_ADMIN_PASSWORD: 
  template:
    metadata:
      name: identity-service-admin
      namespace: grocery
    type: Opaque
