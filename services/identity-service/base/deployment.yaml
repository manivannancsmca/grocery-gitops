# identity-service: Sign-in, tokens (JWT + JWKS), users and roles of all five stakeholders.
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
    spec:
      containers:
        - name: app
          image: grocery/identity-service
          ports:
            - { name: http, containerPort: 8101 }
          env:
            - { name: DB_USERNAME, value: identity_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: identity-service-db, key: DB_PASSWORD }
            # The first SUPER_ADMIN, created only when none exists.
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: identity-service-admin, key: BOOTSTRAP_ADMIN_EMAIL }
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: identity-service-admin, key: BOOTSTRAP_ADMIN_PASSWORD }
