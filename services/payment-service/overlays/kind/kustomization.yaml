apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - db.sealed.yaml # payment-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of payment-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/payment-service
    newName: ghcr.io/manivannancsmca/grocery-payment-service
    newTag: sha-b100f7412810d1b0104a2ce17e0dd20df7c9cd0d
    digest: sha256:2443d5a0de128ed63766e1162314e3c9849b9c3d4506afd796492f6f1b1fdda6
