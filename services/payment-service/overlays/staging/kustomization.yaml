# payment-service on the staging EKS cluster: 2+ replicas (HPA), PodDisruptionBudget, spread over zones, secrets from
# AWS Secrets Manager (External Secrets Operator), the "aws" Spring profile (services/_shared/overlays/staging).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - external-secrets.yaml
images:
  - name: grocery/payment-service
    newName: ghcr.io/manivannancsmca/grocery-payment-service
    newTag: sha-253e4aa724ee0e08c1a55f902e6991b6d2489c6a
    digest: sha256:e2755287d192f5044c4524a1881709009cf1095c0730c09acee1ecd4e9426951
patches:
  - target: {kind: Deployment, name: payment-service}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payment-service
      spec:
        replicas: 2
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector: {}
                matchLabelKeys: [app.kubernetes.io/name, pod-template-hash]
            containers:
              - name: app
                resources:
                  requests: { cpu: 100m, memory: 512Mi }
                  limits: { memory: 768Mi }
                envFrom:
                  - configMapRef: { name: grocery-runtime }
                  - secretRef: { name: payment-service-db }
                  - secretRef: { name: payment-service-kafka }
