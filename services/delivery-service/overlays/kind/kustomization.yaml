apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - db.sealed.yaml # delivery-service-db: DB_PASSWORD (bootstrap/scripts/seal-kind-secrets.ps1)
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful build of delivery-service:
# the tag names the commit, the digest pins the exact image that was tested and scanned.
images:
  - name: grocery/delivery-service
    newName: ghcr.io/manivannancsmca/grocery-delivery-service
    newTag: sha-b100f7412810d1b0104a2ce17e0dd20df7c9cd0d
    digest: sha256:db28e9ce7d077bd56e744afe7a3504a5a5f2f1b7cf1327244c6e9045fa867033
