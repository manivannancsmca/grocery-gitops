# delivery-service: Delivery partners, offers and live locations.
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: delivery-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: delivery-service
    spec:
      containers:
        - name: app
          image: grocery/delivery-service
          ports:
            - { name: http, containerPort: 8112 }
          env:
            - { name: DB_USERNAME, value: delivery_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: delivery-service-db, key: DB_PASSWORD }
