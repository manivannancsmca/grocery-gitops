# order-service: Orders, returns and complaints.
# Shared settings (security, probes, shutdown, default resources, envFrom grocery-runtime) come from the
# spring-boot component; the image registry, tag and digest come from the environment overlay (set by CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
    spec:
      containers:
        - name: app
          image: grocery/order-service
          ports:
            - { name: http, containerPort: 8110 }
          env:
            - { name: DB_USERNAME, value: order_user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: order-service-db, key: DB_PASSWORD }
