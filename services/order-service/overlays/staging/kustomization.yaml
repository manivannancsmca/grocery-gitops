# order-service on the staging EKS cluster: 2+ replicas (HPA), PodDisruptionBudget, spread over zones, secrets from
# AWS Secrets Manager (External Secrets Operator), the "aws" Spring profile (services/_shared/overlays/staging).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - external-secrets.yaml
images:
  - name: grocery/order-service
    newName: ghcr.io/manivannancsmca/grocery-order-service
    newTag: sha-a8308f2047870c1974d9ef7a36f76033d831d74c
    digest: sha256:cf512c3116a2e458bc8d53240b2633e23a40197a8b9aa5a4dec7843fb2c62440
patches:
  - target: {kind: Deployment, name: order-service}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order-service
      spec:
        replicas: 2
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector: {}
                matchLabelKeys: [app.kubernetes.io/name, pod-template-hash]
            containers:
              - name: app
                resources:
                  requests: { cpu: 100m, memory: 512Mi }
                  limits: { memory: 768Mi }
                envFrom:
                  - configMapRef: { name: grocery-runtime }
                  - secretRef: { name: order-service-db }
                  - secretRef: { name: order-service-kafka }
