# grocery-platform on the prod EKS cluster: cluster add-ons and Argo CD (admins only).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: grocery-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster add-ons and Argo CD (admins only)
  sourceRepos:
    - git@github.com:manivannancsmca/grocery-gitops.git
    - https://argoproj.github.io/argo-helm
    - https://charts.external-secrets.io
    - https://kubernetes-sigs.github.io/metrics-server/
    - docker.io/envoyproxy
  destinations:
    - { server: https://kubernetes.default.svc, namespace: argocd }
    - { server: https://kubernetes.default.svc, namespace: kube-system }
    - { server: https://kubernetes.default.svc, namespace: external-secrets }
    - { server: https://kubernetes.default.svc, namespace: envoy-gateway-system }
    - { server: https://kubernetes.default.svc, namespace: grocery-edge }
    - { server: https://kubernetes.default.svc, namespace: "" }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
