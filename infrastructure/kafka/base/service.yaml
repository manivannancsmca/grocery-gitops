apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - { name: kafka, port: 29092, targetPort: kafka }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - { name: kafka, port: 29092, targetPort: kafka }
    - { name: controller, port: 9093, targetPort: controller }
