# SealedSecret grocery-infra/mysql-root - generated by bootstrap/scripts/seal-kind-secrets.ps1; decryptable only by the Kind cluster's controller.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mysql-root
  namespace: grocery-infra
spec:
  encryptedData:
    MYSQL_ROOT_PASSWORD: 
  template:
    metadata:
      name: mysql-root
      namespace: grocery-infra
    type: Opaque
