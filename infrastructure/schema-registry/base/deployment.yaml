# Confluent Schema Registry: the central Avro schemas of every event (stored in Kafka's compacted _schemas topic,
# so the pod itself is stateless). Compatibility BACKWARD_TRANSITIVE is enforced on registration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
    spec:
      # The image reads SCHEMA_REGISTRY_* variables as settings; a service link would inject SCHEMA_REGISTRY_PORT.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:8.2.4
          env:
            - { name: SCHEMA_REGISTRY_HOST_NAME, value: schema-registry }
            - { name: SCHEMA_REGISTRY_LISTENERS, value: "http://0.0.0.0:8081" }
            - { name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, value: "PLAINTEXT://kafka:29092" }
            - { name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC, value: _schemas }
            - { name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL, value: backward_transitive }
            - { name: SCHEMA_REGISTRY_HEAP_OPTS, value: "-Xms128m -Xmx320m" }
          ports:
            - { name: http, containerPort: 8081 }
          startupProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /subjects, port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
spec:
  selector:
    app.kubernetes.io/name: schema-registry
  ports:
    - { name: http, port: 8081, targetPort: http }
