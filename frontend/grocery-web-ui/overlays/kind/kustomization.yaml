apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
patches:
  - target: {kind: HTTPRoute, name: grocery-web-ui}
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [grocery.localhost, grocery.localtest.me]
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful frontend build.
images:
  - name: grocery/grocery-web-ui
    newName: ghcr.io/manivannancsmca/grocery-web-ui
    newTag: sha-addf7e9c10d150a08f87dbdc208935dae516ca2b
    digest: sha256:f8503ef405d7abf12d2cc596e7fb2599045dab71e1fb6c9a1b76ea512e871d03
