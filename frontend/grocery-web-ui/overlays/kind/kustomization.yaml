apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
patches:
  - target: {kind: HTTPRoute, name: grocery-web-ui}
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [grocery.localhost, grocery.localtest.me]
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful frontend build.
images:
  - name: grocery/grocery-web-ui
    newName: ghcr.io/manivannancsmca/grocery-web-ui
    newTag: sha-a8308f2047870c1974d9ef7a36f76033d831d74c
    digest: sha256:c00dfee4931ea4fadfbf8b519f897b67411a62a401d98c9a1b0bae7d1365e8b6
