apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
patches:
  - target: {kind: HTTPRoute, name: grocery-web-ui}
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [grocery.localhost, grocery.localtest.me]
# Updated by CI (grocery-ai-app .github/scripts/update-gitops.sh) after every successful frontend build.
images:
  - name: grocery/grocery-web-ui
    newName: ghcr.io/manivannancsmca/grocery-web-ui
    newTag: sha-95d6edf57d816409276bac589abd0cbc24f328fe
    digest: sha256:bc60f2923ce4245ff91afe4c85bf4c8eba02d1e47933bdd4396ddb4fb521a42e
