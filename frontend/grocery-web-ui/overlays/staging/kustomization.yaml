apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
patches:
  - target: {kind: HTTPRoute, name: grocery-web-ui}
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [staging.grocery.example.com]
  - target: {kind: Deployment, name: grocery-web-ui}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
images:
  - name: grocery/grocery-web-ui
    newName: ghcr.io/manivannancsmca/grocery-web-ui
    newTag: sha-a8308f2047870c1974d9ef7a36f76033d831d74c
    digest: sha256:c00dfee4931ea4fadfbf8b519f897b67411a62a401d98c9a1b0bae7d1365e8b6
