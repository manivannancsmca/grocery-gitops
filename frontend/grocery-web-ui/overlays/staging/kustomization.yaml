apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grocery
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
patches:
  - target: {kind: HTTPRoute, name: grocery-web-ui}
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [staging.grocery.example.com]
  - target: {kind: Deployment, name: grocery-web-ui}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
images:
  - name: grocery/grocery-web-ui
    newName: ghcr.io/manivannancsmca/grocery-web-ui
    newTag: sha-95d6edf57d816409276bac589abd0cbc24f328fe
    digest: sha256:bc60f2923ce4245ff91afe4c85bf4c8eba02d1e47933bdd4396ddb4fb521a42e
