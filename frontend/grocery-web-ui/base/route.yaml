# Everything under the environment's host goes to the frontend; its nginx forwards /api to the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grocery-web-ui
spec:
  parentRefs:
    - name: public
      namespace: grocery-edge
      sectionName: http
  hostnames:
    - grocery.example.com     # replaced per environment
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: grocery-web-ui
          port: 80
