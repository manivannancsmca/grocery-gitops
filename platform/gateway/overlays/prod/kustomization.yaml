apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../eks-common
patches:
  # The NLB terminates TLS on 443 (ACM certificate) and forwards plain HTTP to the same port on Envoy.
  - target: { kind: Gateway, name: public }
    patch: |
      # No hostname filter on the listener: every HTTPRoute names its own host (the app is on the apex domain).
      - op: remove
        path: /spec/listeners/0/hostname
      - op: replace
        path: /spec/listeners/0/port
        value: 443
  - target: { kind: HTTPRoute, name: argocd-server }
    patch: |
      - op: replace
        path: /spec/hostnames
        value: [argocd.grocery.example.com]
