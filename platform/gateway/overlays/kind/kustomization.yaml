apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - gatewayclass.yaml
  - argocd-route.yaml
patches:
  # No hostname filter: each HTTPRoute lists its names under both local domains, which reach 127.0.0.1 without any
  # hosts-file entry:
  #   *.localhost     reserved loopback domain; browsers resolve it themselves (and treat it as a secure context)
  #   *.localtest.me  public DNS name pointing at 127.0.0.1; works for every CLI (curl, argocd, ...)
  - target: { kind: Gateway, name: public }
    patch: |
      - op: remove
        path: /spec/listeners/0/hostname
