apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - gatewayclass.yaml
  - argocd-route.yaml
patches:
  # Every *.localtest.me name resolves to 127.0.0.1, so no hosts-file entries are needed.
  - target: { kind: Gateway, name: public }
    patch: |
      - op: replace
        path: /spec/listeners/0/hostname
        value: "*.localtest.me"
