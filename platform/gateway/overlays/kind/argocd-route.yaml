# Argo CD UI and API at http://argocd.localtest.me (argocd-server runs with server.insecure; the CLI uses
# `argocd login argocd.localtest.me:80 --grpc-web --plaintext`; the CLI assumes 443 when the port is left out).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: public
      namespace: grocery-edge
      sectionName: http
  hostnames:
    - argocd.localtest.me
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: argocd-server
          port: 80
