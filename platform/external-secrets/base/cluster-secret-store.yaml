# The one place that says where secrets come from: AWS Secrets Manager in the cluster's own account and region,
# authenticated as the External Secrets controller's service account (Pod Identity / IRSA). Every ExternalSecret
# of the services refers to this store by name.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE-REGION
  # Only the application namespace may use this store.
  conditions:
    - namespaces: [grocery]
