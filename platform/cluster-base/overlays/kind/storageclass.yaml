# Storage for the stateful infrastructure on Kind. Same provisioner as Kind's default "standard" class
# (local-path), but the volume is KEPT when its claim is deleted (reclaimPolicy: Retain), so deleting a StatefulSet or
# a PVC by mistake does not delete the data. Deleting a retained volume is a deliberate `kubectl delete pv`.
# EKS gets an equivalent gp3 class with Retain in overlays/eks.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: grocery-retain
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
