# EBS gp3 volumes (EBS CSI driver add-on) that are kept when their claim is deleted, for anything stateful that runs
# inside the cluster on EKS. Same name as on Kind, so manifests are portable.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: grocery-retain
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
