apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - storageclass.yaml
patches:
  # On EKS the application namespace enforces Pod Security "restricted" (every workload there already complies).
  - target: { kind: Namespace, name: grocery }
    patch: |
      - op: replace
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: restricted
